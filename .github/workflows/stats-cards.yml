name: Update README cards

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  list-repos:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}

    steps:
      - name: List non-fork repositories
        id: list
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repos=$(
            gh repo list "$OWNER" \
              --limit 1000 \
              --json name,isFork \
              --jq '[.[] | select(.isFork == false) | {repo: .name}]'
          )

          echo "Repositories:"
          echo "$repos" | jq .

          echo "repos=${repos}" >> "$GITHUB_OUTPUT"

  generate-repo-cards:
    needs: list-repos
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.list-repos.outputs.repos) }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare directory
        run: |
          mkdir -p profile/repos

      - name: Generate pin card for ${{ matrix.repo }}
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=${{ matrix.repo }}
          path: profile/repos/${{ matrix.repo }}.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated repository card
        id: validate
        run: |
          card="profile/repos/${{ matrix.repo }}.svg"
          if test -s "$card" \
            && grep -q '<svg' "$card" \
            && ! grep -Eqi 'Something went wrong|Resource not accessible|Repository Not found' "$card"; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "The generated card is invalid; keeping the version already in the repository." >&2
            rm -f "$card"
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload repo card
        if: steps.validate.outputs.valid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: repo-card-${{ matrix.repo }}
          path: profile/repos/${{ matrix.repo }}.svg
          if-no-files-found: error

  generate-summary-cards:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare directory
        run: |
          mkdir -p profile

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated summary cards
        run: |
          for card in profile/stats.svg profile/top-langs.svg; do
            if ! test -s "$card" \
              || ! grep -q '<svg' "$card" \
              || grep -Eqi 'Something went wrong|Resource not accessible|Repository Not found' "$card"; then
              echo "$card is invalid; keeping the version already in the repository." >&2
              rm -f "$card"
            fi
          done

      - name: Upload summary cards
        uses: actions/upload-artifact@v4
        with:
          name: summary-cards
          path: |
            profile/stats.svg
            profile/top-langs.svg
          if-no-files-found: ignore

  commit-cards:
    needs:
      - generate-repo-cards
      - generate-summary-cards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download generated cards
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -print

      - name: Move cards into profile directory
        run: |
          mkdir -p profile/repos

          if test -d artifacts; then
            find artifacts -mindepth 2 -maxdepth 2 -type f -name "*.svg" \
              ! -name "stats.svg" \
              ! -name "top-langs.svg" \
              -exec cp {} profile/repos/ \;

            find artifacts/summary-cards -maxdepth 1 -type f -name "*.svg" \
              -exec cp {} profile/ \; 2>/dev/null || true
          fi

          echo "Final profile files:"
          find profile -type f -name "*.svg" -print

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add profile
          git commit -m "Update README cards" || exit 0
          git push
